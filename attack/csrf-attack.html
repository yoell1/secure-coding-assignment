<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>CSRF 공격 페이지 (실습용)</title></head>

<h1>이벤트 당첨!</h1>
<form action="http://localhost:8080/repay-form" method="post">

</form>
</body>
</html>
