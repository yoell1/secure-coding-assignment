# 과제용 설정 (Oracle 21c XE 로컬 환경)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=C##SECURE
spring.datasource.password=${ASSIGN_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

assign.aes-key=${ASSIGN_AES_KEY}
logging.level.edu.secure.assign=INFO

# 로그인 쿠키: 다른 사이트에서 보낸 POST에는 쿠키를 붙이지 않음 (CSRF 이중 방어)
server.servlet.session.cookie.same-site=lax
# 세션 ID는 쿠키로만 주고받음 (주소 뒤 ;jsessionid= 노출 방지)
server.servlet.session.tracking-modes=cookie